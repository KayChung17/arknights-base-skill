      <circle cx="874" cy="252" r="24" fill="#16856e"/>
      <text x="874" y="260" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">4</text>
      <text x="858" y="314" fill="#18332e" font-size="26" font-weight="700">候选枚举</text>
      <line x1="858" y1="336" x2="1036" y2="336" stroke="#dce8e5" stroke-width="2"/>
      <text x="858" y="372" fill="#526863" font-size="18">布局 Profile</text>
      <text x="858" y="401" fill="#526863" font-size="18">单房间组合</text>
    </g>

    <g>
      <rect x="1090" y="206" width="234" height="220" rx="8" fill="#ffffff" stroke="#d5b17a" stroke-width="2"/>
      <circle cx="1134" cy="252" r="24" fill="#c0772a"/>
      <text x="1134" y="260" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">5</text>
      <text x="1118" y="314" fill="#18332e" font-size="26" font-weight="700">全局求解</text>
      <line x1="1118" y1="336" x2="1296" y2="336" stroke="#eee2d0" stroke-width="2"/>
      <text x="1118" y="372" fill="#526863" font-size="18">MILP · 工时 · 资源</text>
      <text x="1118" y="401" fill="#526863" font-size="18">无人机</text>
    </g>

    <g>
      <rect x="1350" y="206" width="234" height="220" rx="8" fill="#ffffff" stroke="#d5b17a" stroke-width="2"/>
      <circle cx="1394" cy="252" r="24" fill="#c0772a"/>
      <text x="1394" y="260" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">6</text>
      <text x="1378" y="314" fill="#18332e" font-size="26" font-weight="700">逐区间模拟</text>
      <line x1="1378" y1="336" x2="1556" y2="336" stroke="#eee2d0" stroke-width="2"/>
      <text x="1378" y="372" fill="#526863" font-size="18">订单 · 库存 · 心情</text>
      <text x="1378" y="401" fill="#526863" font-size="18">宿舍</text>
    </g>

    <g>
      <rect x="1610" y="206" width="260" height="220" rx="8" fill="#18332e" stroke="#18332e" stroke-width="2"/>
      <circle cx="1654" cy="252" r="24" fill="#e1a759"/>
      <text x="1654" y="260" text-anchor="middle" fill="#18332e" font-size="22" font-weight="700">7</text>
      <text x="1638" y="314" fill="#ffffff" font-size="26" font-weight="700">审计与输出</text>
      <line x1="1638" y1="336" x2="1842" y2="336" stroke="#49645e" stroke-width="2"/>
      <text x="1638" y="372" fill="#d8e6e2" font-size="18">验证 · schedule.json</text>
      <text x="1638" y="401" fill="#d8e6e2" font-size="18">report.md</text>
    </g>
