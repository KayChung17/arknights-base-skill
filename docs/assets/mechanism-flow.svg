  <path d="M 1740 446 V 552 Q 1740 582 1710 582 H 457 Q 427 582 427 552 V 448" fill="none" stroke="#c0772a" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round" marker-end="url(#return-arrow)"/>
  <rect x="850" y="552" width="470" height="58" rx="8" fill="#fff8ed" stroke="#e4c493" stroke-width="2"/>
  <text x="1085" y="589" text-anchor="middle" fill="#8e541c" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">验证失败：修正配置或机制数据</text>

  <g font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16">
    <circle cx="725" cy="660" r="7" fill="#16856e"/>
    <text x="741" y="666" fill="#526863">数据与机制</text>
    <circle cx="922" cy="660" r="7" fill="#c0772a"/>
    <text x="938" y="666" fill="#526863">优化与模拟</text>
    <circle cx="1139" cy="660" r="7" fill="#18332e"/>
    <text x="1155" y="666" fill="#526863">可执行产物</text>
  </g>
</svg>
