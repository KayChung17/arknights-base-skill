<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="720" viewBox="0 0 1920 720" role="img" aria-labelledby="title desc">
  <title id="title">明日方舟基建排班优化流程</title>
  <desc id="desc">从用户输入、输入预检、机制计算、候选枚举、全局求解、逐区间模拟到审计与输出的完整流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54706a"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0772a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17352f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1920" height="720" fill="#f7faf9"/>
  <rect x="0" y="0" width="1920" height="12" fill="#16856e"/>

  <text x="960" y="76" text-anchor="middle" fill="#18332e" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700">明日方舟基建排班优化流程</text>
  <text x="960" y="112" text-anchor="middle" fill="#60736f" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="18">从个人数据与约束，到可验证、可执行的排班文件</text>

  <g fill="none" stroke="#54706a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 284 316 H 310"/>
    <path d="M 544 316 H 570"/>
    <path d="M 804 316 H 830"/>
    <path d="M 1064 316 H 1090"/>
    <path d="M 1324 316 H 1350"/>
    <path d="M 1584 316 H 1610"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="50" y="206" width="234" height="220" rx="8" fill="#ffffff" stroke="#a9c7bf" stroke-width="2"/>
      <circle cx="94" cy="252" r="24" fill="#16856e"/>
      <text x="94" y="260" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">1</text>
      <text x="78" y="314" fill="#18332e" font-size="26" font-weight="700">用户输入</text>
      <line x1="78" y1="336" x2="256" y2="336" stroke="#dce8e5" stroke-width="2"/>
      <text x="78" y="372" fill="#526863" font-size="18">roster.xlsx</text>
      <text x="78" y="401" fill="#526863" font-size="18">目标与约束</text>
    </g>

    <g>
      <rect x="310" y="206" width="234" height="220" rx="8" fill="#ffffff" stroke="#a9c7bf" stroke-width="2"/>
      <circle cx="354" cy="252" r="24" fill="#16856e"/>
      <text x="354" y="260" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">2</text>
      <text x="338" y="314" fill="#18332e" font-size="26" font-weight="700">输入预检</text>
      <line x1="338" y1="336" x2="516" y2="336" stroke="#dce8e5" stroke-width="2"/>
      <text x="338" y="372" fill="#526863" font-size="18">设施 · 电力 · 上线</text>
      <text x="338" y="401" fill="#526863" font-size="18">数据覆盖</text>
    </g>

    <g>
      <rect x="570" y="206" width="234" height="220" rx="8" fill="#ffffff" stroke="#85b9ad" stroke-width="2"/>
      <circle cx="614" cy="252" r="24" fill="#16856e"/>
      <text x="614" y="260" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">3</text>
      <text x="598" y="314" fill="#18332e" font-size="26" font-weight="700">机制计算</text>
      <line x1="598" y1="336" x2="776" y2="336" stroke="#dce8e5" stroke-width="2"/>
